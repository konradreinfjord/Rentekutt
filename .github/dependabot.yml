version: 2
updates:
  # NuGet-avhengigheter i .NET-prosjektet.
  - package-ecosystem: nuget
    directory: "/src/RentkuttCRM"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "deps"

  # GitHub Actions brukt i workflowene.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    commit-message:
      prefix: "ci"
